name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the web app
        working-directory: frontend
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and sdist
        run: uv build
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/w && VIRTUAL_ENV=/tmp/w uv pip install dist/*.whl
          HANI2_HOME=/tmp/h /tmp/w/bin/hani2 setup
          test -f /tmp/w/lib/python*/site-packages/hani2/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv pip install -e ".[docs]"
      - run: uv run --no-sync mkdocs gh-deploy --force
