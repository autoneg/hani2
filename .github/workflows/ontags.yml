name: CI (On-Tags)
on:
  push:
    tags:
      - "*"
jobs:
  tests:
    name: "Tests on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
      - uses: "actions/checkout@v6"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v8.1.0"
        with:
          version: "latest"
      - name: "Set up Python"
        run: uv python install 3.13
      - name: "Install in dev mode"
        run: uv sync --python 3.13 --extra dev
      - name: "Import package"
        run: uv run --no-sync python -c "import hani2, hani2.server; print('hani2', hani2.__version__, 'imported successfully')"
      - name: "Run the test suite"
        run: uv run --no-sync pytest -q
