id: HAN2026-PostSession
title: HAN2026-PostSession
description: 'The questions HAN 2026 asked after each session: ease of use, engagement, the usefulness of the interface''s tools (Preferences, Scenario Info, Value Histogram, Trace, Utility-based Selector) and comments.'
reference: "Questionnaires of the HAN 2026 human-agent negotiation competition"
forms: [post_session]
questions:
  - {id: ease_of_use, text: 'How easy was the negotiation interface to use?', type: likert5, labels: {1: Very difficult, 5: Very easy}, required: true}
  - {id: engagement, text: 'How engaging did you find the negotiation task?', type: likert5, labels: {1: Not at all engaging, 5: Very engaging}, required: true}
  - {id: tool_preferences, text: 'How useful was the Preferences tab (your utility weights / preferences) during the session?', type: select, options: [I did not use this tool, Not useful at all, Slightly useful, Moderately useful, Very useful, Extremely useful], required: true}
  - {id: tool_scenario_info, text: 'How useful was the Scenario Info tab (description of the scenario you were bargaining over)?', type: select, options: [I did not use this tool, Not useful at all, Slightly useful, Moderately useful, Very useful, Extremely useful], required: true}
  - {id: tool_value_histogram, text: 'How useful was the Value Histogram tab (distribution of issue values you''ve offered/received)?', type: select, options: [I did not use this tool, Not useful at all, Slightly useful, Moderately useful, Very useful, Extremely useful], required: true}
  - {id: tool_trace, text: 'How useful was the Trace tab (full history of offers and messages)?', type: select, options: [I did not use this tool, Not useful at all, Slightly useful, Moderately useful, Very useful, Extremely useful], required: true}
  - {id: tool_utility_selector, text: 'How useful was the outcome-sampling helper on the right side (the Utility-based Selector that lets you generate offers at a target utility)?', type: select, options: [I did not use this tool, Not useful at all, Slightly useful, Moderately useful, Very useful, Extremely useful], required: true}
  - {id: comments, text: 'Anything else you would like to tell us about this session? (Optional.)', type: text, required: false}
