id: opponent_perception
title: "Opponent perception and relationship"
description: "How kind, intelligent and human-like the opponent seemed, whether the participant would negotiate with it again and felt connected to it (exit-interview items)."
reference: "Items of the HANI2 evaluation questionnaire; relationship items after the Subjective Value Inventory."
forms: [per_negotiation]
questions:
  - {id: opponent_kind, text: "How **kind** was your opponent?", type: likert7, required: true, scale: opponent_kindness, labels: {1: "Not at all", 7: "Very"}}
  - {id: opponent_intelligent, text: "How **intelligent** was your opponent?", type: likert7, required: true, scale: opponent_intelligence, labels: {1: "Not at all", 7: "Very"}}
  - {id: opponent_human, text: "Do you think your opponent was a human or an AI?", type: likert7, required: true, scale: opponent_humanlike, labels: {1: "Surely an AI", 7: "Surely a human"}}
  - {id: negotiate_again, text: "I would like to negotiate with this opponent again.", type: likert7, required: true, scale: relationship, labels: {1: "Strongly disagree", 7: "Strongly agree"}}
  - {id: opponent_connected, text: "I felt a human connection with my opponent.", type: likert7, required: true, scale: relationship, labels: {1: "Strongly disagree", 7: "Strongly agree"}}
  - {id: opponent_keep_deal, text: "I expect both sides would live up to the deal we reached.", type: likert7, required: false, scale: relationship, labels: {1: "Strongly disagree", 7: "Strongly agree"}}
