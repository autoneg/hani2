id: sus
title: "System Usability Scale (SUS), 10 items"
description: "Brooke's 10-item usability scale about the negotiation interface, 5-point agreement. Even-numbered items are reversed. The standard 0-100 SUS score is 2.5 x the sum of the item contributions."
reference: "Brooke (1996). SUS: a 'quick and dirty' usability scale. In Usability Evaluation in Industry."
forms: [post_session]
tags: []
questions:
  - {id: sus_1, text: "I think that I would like to use this system frequently.", type: likert5, required: true, scale: sus, labels: {1: "Strongly disagree", 5: "Strongly agree"}}
  - {id: sus_2, text: "I found the system unnecessarily complex.", type: likert5, required: true, scale: sus, reverse: true, labels: {1: "Strongly disagree", 5: "Strongly agree"}}
  - {id: sus_3, text: "I thought the system was easy to use.", type: likert5, required: true, scale: sus, labels: {1: "Strongly disagree", 5: "Strongly agree"}}
  - {id: sus_4, text: "I think that I would need the support of a technical person to be able to use this system.", type: likert5, required: true, scale: sus, reverse: true, labels: {1: "Strongly disagree", 5: "Strongly agree"}}
  - {id: sus_5, text: "I found the various functions in this system were well integrated.", type: likert5, required: true, scale: sus, labels: {1: "Strongly disagree", 5: "Strongly agree"}}
  - {id: sus_6, text: "I thought there was too much inconsistency in this system.", type: likert5, required: true, scale: sus, reverse: true, labels: {1: "Strongly disagree", 5: "Strongly agree"}}
  - {id: sus_7, text: "I would imagine that most people would learn to use this system very quickly.", type: likert5, required: true, scale: sus, labels: {1: "Strongly disagree", 5: "Strongly agree"}}
  - {id: sus_8, text: "I found the system very cumbersome to use.", type: likert5, required: true, scale: sus, reverse: true, labels: {1: "Strongly disagree", 5: "Strongly agree"}}
  - {id: sus_9, text: "I felt very confident using the system.", type: likert5, required: true, scale: sus, labels: {1: "Strongly disagree", 5: "Strongly agree"}}
  - {id: sus_10, text: "I needed to learn a lot of things before I could get going with this system.", type: likert5, required: true, scale: sus, reverse: true, labels: {1: "Strongly disagree", 5: "Strongly agree"}}
