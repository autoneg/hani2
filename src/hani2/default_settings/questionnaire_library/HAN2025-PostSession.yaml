id: HAN2025-PostSession
title: HAN2025-PostSession
description: 'The post-session questionnaire of HAN 2025, which the competition page asked participants to fill after every negotiation session (a later version of the page drops it, and the rules required only the pre- and post-study forms): enjoyment, ease, the opponent''s human-likeness, intelligence, speed and predictability, the support tools, and expectations about AI negotiators. Converted from the Google Form: the identification items (registered user name, session id, date and time, number of negotiations) are left out, since HANI2 records them; a question the form asks twice is kept once. The 1–5 scales had no endpoint labels. The form: “Human-Agent Negotiation League Post-session Questionnaire”, https://forms.gle/qT8VtQYrV5RuodML6.'
reference: "Questionnaires of the HAN 2025 human-agent negotiation competition (pilot, IJCAI 2025)"
forms: [post_session]
tags: [opponent]
questions:
  - {id: han2025_enjoyable, text: 'How enjoyable was the negotiation with our system (5 = most enjoyable)?', type: likert5, required: true}
  - {id: han2025_easy, text: 'How easy was the negotiation with our system (5 = easiest)?', type: likert5, required: true}
  - {id: han2025_humanlike, text: 'How human-like was your AI negotiation partner to b (5 = most human-like)?', type: likert5, required: true}
  - {id: han2025_helpful_support, text: 'How helpful is our system as a negotiation support system (5 = most helpful)?', type: likert5, required: true}
  - {id: han2025_useful_tools, text: 'Which tools were most useful for you in supporting your negotiation?', type: text, required: true}
  - {id: han2025_opponent_intelligent, text: 'How intelligent was our system as a negotiator against you (5 = most intelligent)?', type: likert5, required: true}
  - {id: han2025_opponent_fast, text: 'How fast was our system as a negotiator against you (5 = fastest)?', type: likert5, required: true}
  - {id: han2025_opponent_predictable, text: 'How predictable was the performance of our system as a negotiator against you (5 = most predictable)?', type: likert5, required: true}
  - {id: han2025_expect_ai_negotiating, text: 'How effective do you expect an AI negotiation system in negotiating with human partners (5 = most effective)?', type: likert5, required: true}
  - {id: han2025_expect_ai_supporting, text: 'How effective do you expect an AI negotiation system in supporting its own human user (5 = most effective)?', type: likert5, required: true}
  - {id: han2025_expect_high_utility, text: 'How confident are you in achieving high utilities (scores) when negotiating with our system (5 = most confident)?', type: likert5, required: true}
  - {id: han2025_expect_structured_offers, text: 'How effective do you expect structured offers in human-agent negotiation (5 = most effective)?', type: likert5, required: false}
  - {id: han2025_expect_natural_language, text: 'How effective do you expect allowing natural language interaction in human-agent negotiation (5 = most effective)?', type: likert5, required: false}
