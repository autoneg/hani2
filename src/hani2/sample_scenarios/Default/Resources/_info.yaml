Name: Resources
title: Resource Exchange
short_description: In this scenario, two traders split a shipment of gold, iron, bananas and spices (five items
  of each).
long_description: |-
  **The Domain** There are four issues, one per good: how many of its five items you get; your opponent gets the rest. Each item is worth some points to you (see your hints) and different points to your opponent.

  **The Roles**

  - **agent**: one of the two traders
  - **human**: one of the two traders

  **Utility Function** Every option of every issue has a value for you, and some issues matter more to you than others. You can see your preferences in the *Preferences* pane, and the hints tell you your most and least important issues.

  **Opponent Utility Function** Your opponent has their own values and priorities, which you do not know. Their role, described above, tells you which way they probably lean.

  **Value on Disagreement (Reservation Value)** Without a deal the shipment is sold off at a loss. Your reservation value is the utility you get in that case; your opponent has one too, which you do not know.

  *Adapted from the item-split games of the IAGO platform (ANAC Human-Agent League). (the resource-exchange demonstration game).*
human_role: human
