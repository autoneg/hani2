Name: Grocery
title: Groceries Distribution
short_description: In this scenario, you and an agent bought 4 items of 4 types of fruits and you are negotiating
  about how to distribute them between yourselves.
long_description: |
  **The Domain** There are four issues corresponding to the number of items of each fruit that **you** get.

  **Utility Function** Each fruit has some value for each of the two negotiators. The more items you get, the higher the utility you get.

  **Value on Disagreement (Reservation Value)** The value you get from disagreement. You can think of this as an outside option.
n_issue_columns: 2
issue_description:
  watermelon 🍉: How many watermelons you get
  banana 🍌: How many bananas you get
  orange 🟠: How many oranges you get
  apple 🍎: How many apples you get
hints:
  agent:
    Most Important Item: banana 🍌
    Least Important Item: apple 🍎
  human:
    Most Important Item: banana 🍌
    Least Important Item: watermelon 🍉
