site_name: HANI2
site_description: A web interface for human-agent negotiation studies
site_url: https://autoneg.github.io/hani2/
repo_url: https://github.com/autoneg/hani2
repo_name: autoneg/hani2
edit_uri: edit/main/docs/
copyright: Copyright &copy; Yasser Mohammad. Licensed under AGPL-3.0-or-later.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            members_order: source
            docstring_style: google
            show_if_no_docstring: false
            filters: ["!^_"]
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css

nav:
  - Home: index.md
  - Features: features.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
      - Command line: getting-started/cli.md
  - User guide:
      - The interface: guide/interface.md
      - Tools: guide/tools.md
      - Showing other preferences: guide/preferences.md
      - Assistant: guide/assistant.md
      - Who knows what: guide/information.md
      - Autopilot: guide/autopilot.md
      - WebMCP (browser agents): guide/webmcp.md
      - Models and connections: guide/models.md
      - Language models: guide/llms.md
      - Opponents: guide/opponents.md
      - Scenarios: guide/scenarios.md
      - Scenario sets: guide/scenario-sets.md
      - Compositional scenarios: guide/compositional.md
      - Library and groups: guide/library.md
      - Projects and studies: guide/projects.md
      - Scheduling methods: guide/scheduling.md
      - Studies and results: guide/studies.md
      - Recording and replay: guide/recordings.md
      - Evaluation metrics: guide/evaluation.md
      - Metric reference: guide/metrics.md
      - Prolific: guide/prolific.md
      - Authentication: guide/authentication.md
      - Admin console: guide/admin.md
      - Configuration reference: guide/configuration.md
  - Tutorials:
      - Build an Assistant: tutorials/assistant.md
      - Build a tool: tutorials/tools.md
  - Reference:
      - Architecture: reference/architecture.md
      - Python API: reference/api.md
      - Library API: reference/library-api.md
  - Changelog: changelog.md
