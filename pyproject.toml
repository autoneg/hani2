[project]
name = "hani2"
version = "0.1.0"
description = "HANI2: a web interface for human-agent negotiation studies, with an AI Assistant and pluggable tools"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Yasser Mohammad", email = "yasserfarouk@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "negmas>=0.17.0",
    "negmas-llm>=0.4.3",
    "litellm>=1.0.0",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "typer>=0.9",
    "pandas>=2.0",
    "plotly>=5.20",
    "pyyaml>=6.0",
    "attrs>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout", "ruff"]
# the HAN league agents: adds the :han<year>-all / -qualified / -finalists / -winners groups
han = ["han-agents>=0.0.2"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
hani2 = "hani2.cli:app"

[project.urls]
Homepage = "https://github.com/autoneg/hani2"
Documentation = "https://autoneg.github.io/hani2/"
Repository = "https://github.com/autoneg/hani2"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hani2"]
artifacts = ["src/hani2/web/**"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
include = ["src/hani2", "README.md", "LICENSE", "docs", "mkdocs.yml", "tests", "examples", "frontend/src", "frontend/*.json", "frontend/*.ts", "frontend/*.js", "frontend/index.html"]
artifacts = ["src/hani2/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
filterwarnings = ["ignore::DeprecationWarning", "ignore::SyntaxWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.uv.sources]
# the HAN league agents (the `han` extra) track GitHub main, where finalists and
# winners are flagged as they are announced; `pip install hani2[han]` uses PyPI
han-agents = { git = "https://github.com/autoneg/han-agents", branch = "main" }
